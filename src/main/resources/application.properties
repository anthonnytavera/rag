spring.application.name=rag

# --- Gemini (the API key is read from the GEMINI_API_KEY environment variable) ---
spring.ai.google.genai.api-key=${GEMINI_API_KEY}
spring.ai.google.genai.chat.model=gemini-3.1-flash-lite

spring.ai.google.genai.embedding.api-key=${GEMINI_API_KEY}
spring.ai.google.genai.embedding.text.model=gemini-embedding-001

# --- RAG settings (bound to com.adtavera.rag.config.RagProperties) ---
# Document that is indexed at startup
rag.document-path=classpath:docs/company-handbook.txt
# Prompt template sent to the LLM ({context} and {question} are filled in at runtime)
rag.prompt-path=classpath:prompts/rag-prompt.txt
# Maximum size of each chunk, in tokens
rag.chunk-size=150
# Number of most similar chunks retrieved for each question
rag.top-k=3

# --- OpenAPI / Swagger UI ---
# Swagger UI: http://localhost:8080/swagger-ui.html
# OpenAPI JSON: http://localhost:8080/v3/api-docs
